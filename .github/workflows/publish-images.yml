name: Publish release containers

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Unique full semantic version, for example 0.2.0-rc.1
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  # Promotion spans two GHCR repositories. Serialize every release so a tag
  # run and a manual run can never race on the same destination pair.
  group: publish-images
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ibkr:ibkr@127.0.0.1:5432/ibkr_dashboard_test
      DATABASE_URL: postgresql+asyncpg://ibkr:ibkr@127.0.0.1:5432/ibkr_dashboard_test
      APP_SECRET_KEY: release-verification-key-123456
      IBKR_FLEX_TOKEN: ""
      IBKR_FLEX_QUERY_ID: ""
      IBKR_FLEX_AUTOSYNC: "false"
      IBKR_GATEWAY_AUTOSTART: "false"
      FINNHUB_API_KEY: ""
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ibkr
          POSTGRES_PASSWORD: ibkr
          POSTGRES_DB: ibkr_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ibkr -d ibkr_dashboard_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Verify backend
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff check app tests
          uv run alembic upgrade head
          uv run pytest

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Verify frontend
        working-directory: frontend
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  runtime-smoke:
    name: Verify release-shaped runtime
    needs:
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_USER: ibkr
      POSTGRES_PASSWORD: release-smoke-password-123456
      POSTGRES_DB: ibkr_dashboard
      APP_SECRET_KEY: release-smoke-app-key-123456
      IBKR_GATEWAY_AUTOSTART: "false"
      IBKR_FLEX_AUTOSYNC: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create non-secret smoke configuration
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_APP/release-smoke-app-key-123456/g' .env
          sed -i 's/CHANGE_ME/release-smoke-password-123456/g' .env

      - name: Start and verify containers
        run: |
          docker compose up -d --build --wait
          curl --fail --silent --show-error http://127.0.0.1:8000/api/system/health
          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
          test "$(docker compose exec -T backend id -u)" != "0"
          test "$(docker compose exec -T frontend id -u)" != "0"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Remove smoke volumes
        if: always()
        run: docker compose down -v --remove-orphans

  publish:
    name: Build candidate ${{ matrix.component }}
    needs:
      - verify
      - runtime-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: ibkr-dashboard-backend
          - component: frontend
            image: ibkr-dashboard-frontend
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=build-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=IBKR Dashboard ${{ matrix.component }}
            org.opencontainers.image.description=Read-only IBKR portfolio dashboard

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}

  promote:
    name: Promote verified immutable release tag
    needs:
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify both candidates and promote the immutable release tag
        env:
          MANUAL_TAG: ${{ inputs.image_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          candidate="build-${GITHUB_SHA}"
          images=(ibkr-dashboard-backend ibkr-dashboard-frontend)

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ ! "${MANUAL_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
              echo "Manual image tag must be a full semantic version such as 0.2.0-rc.1" >&2
              exit 1
            fi
            release_tag="${MANUAL_TAG}"
          else
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
              echo "Tag must be semantic, for example v1.2.3" >&2
              exit 1
            fi
            release_tag="${version}"
          fi

          for image in "${images[@]}"; do
            docker buildx imagetools inspect \
              "ghcr.io/${OWNER}/${image}:${candidate}" >/dev/null
          done

          for image in "${images[@]}"; do
            source_ref="ghcr.io/${OWNER}/${image}:${candidate}"
            destination_ref="ghcr.io/${OWNER}/${image}:${release_tag}"
            candidate_digest="$(
              docker buildx imagetools inspect "${source_ref}" \
                | awk '$1 == "Digest:" { print $2; exit }'
            )"
            if [[ -z "${candidate_digest}" ]]; then
              echo "Could not resolve candidate digest for ${image}" >&2
              exit 1
            fi

            if destination_inspect="$(
              docker buildx imagetools inspect "${destination_ref}" 2>&1
            )"; then
              destination_digest="$(
                awk '$1 == "Digest:" { print $2; exit }' <<<"${destination_inspect}"
              )"
              if [[ "${destination_digest}" != "${candidate_digest}" ]]; then
                echo "Refusing to overwrite immutable tag ${destination_ref}" >&2
                exit 1
              fi
              echo "${destination_ref} already points to the verified candidate"
              continue
            elif ! grep -qiE \
              'manifest unknown|no such manifest|(^|: )not found[[:space:]]*$' \
              <<<"${destination_inspect}"; then
              echo "Could not safely determine whether ${destination_ref} exists" >&2
              exit 1
            fi

            docker buildx imagetools create \
              --tag "${destination_ref}" \
              "${source_ref}"
            promoted_digest="$(
              docker buildx imagetools inspect "${destination_ref}" \
                | awk '$1 == "Digest:" { print $2; exit }'
            )"
            if [[ "${promoted_digest}" != "${candidate_digest}" ]]; then
              echo "Promotion verification failed for ${destination_ref}" >&2
              exit 1
            fi
          done
